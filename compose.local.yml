services:
  serveur-api:
    build: .
    environment:
      NODE_ENV: development
      PORT: 3000
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://host.docker.internal:3001}
      ROOM_SERVICE_URL: ${ROOM_SERVICE_URL:-http://host.docker.internal:3003}
      MESSAGE_SERVICE_URL: ${MESSAGE_SERVICE_URL:-http://host.docker.internal:3004}
      USER_CONFIG_SERVICE_URL: ${USER_CONFIG_SERVICE_URL:-http://host.docker.internal:3005}
      PROXY_TIMEOUT_MS: ${PROXY_TIMEOUT_MS:-5000}
      MAX_PROXY_BODY_BYTES: ${MAX_PROXY_BODY_BYTES:-1048576}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-60000}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
